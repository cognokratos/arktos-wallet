[package]
name = "arktos-wallet"
version = "0.1.0"
edition = "2024"
license = "MIT"
# Not a library for crates.io; never publish by accident.
publish = false

[dependencies]
tokio = { version = "1", features = ["full"] }

# Use rusqlite and bundle SQLCipher + a vendored OpenSSL
rusqlite = { version = "0.42", features = ["bundled-sqlcipher-vendored-openssl"] }
# Embedded, versioned SQL migrations (PRAGMA user_version). Exact pin: the
# [patch] below substitutes a vendored copy of this release.
rusqlite_migration = "=2.7.0"

# Official MCP Rust SDK (MCP 2026-07-28, stateless Streamable HTTP server)
rmcp = { version = "3.9", default-features = false, features = [
    "server",
    "macros",
    "transport-streamable-http-server",
] }

axum = "0.8"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Shutdown token passed to the rmcp HTTP transport
tokio-util = "0.7"
anyhow = "1.0.100"

bip39 = "2"
bitcoin = { version = "0.32", features = ["std"] }
tiny-keccak = { version = "2", features = ["keccak"] }
hex = "0.4"
sha2 = "0.11"
http = "1.4.0"
base64 = "0.22.1"
clap = { version = "4.5.54", features = ["derive"] }
utoipa = "5"

# Cryptographic boundary (RustCrypto + OS RNG); see src/keys.rs and src/crypto.rs
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
hkdf = "0.13"
hmac = "0.13"
getrandom = "0.4"
zeroize = "1.8"
secrecy = "0.10"
subtle = "2.6"

[dev-dependencies]
tempfile = "3"
# Official MCP client used by the protocol-level integration tests
rmcp = { version = "3.9", default-features = false, features = [
    "client",
    "transport-streamable-http-client-reqwest",
] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }



# rusqlite_migration 2.7.0 requires rusqlite ^0.41, whose bundled SQLCipher
# still ships an SQLite affected by RUSTSEC-2026-0459. This is the unmodified
# 2.7.0 release with only that requirement raised to 0.42; `make vendor-check`
# proves it against the crates.io archive. Remove once an upstream release
# supports rusqlite 0.42 (see docs/security-advisory-inventory.md).
[patch.crates-io]
rusqlite_migration = { path = "vendor/rusqlite_migration" }

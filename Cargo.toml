[package]
name = "arktos-wallet"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }

# Use rusqlite and bundle SQLCipher + a vendored OpenSSL
rusqlite = { version = "0.38", features = ["bundled-sqlcipher-vendored-openssl"] }

# Official MCP Rust SDK
rmcp = { version = "0.12", features = [
    "server",
    "macros",
    "transport-streamable-http-server"
] }

axum = "0.8"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# For graceful shutdown token used by rmcp streamable-http config
tokio-util = "0.7"
anyhow = "1.0.100"
chrono = { version = "0.4", features = ["serde"] }

bip39 = "2"
bip32 = "0.5"
bitcoin = { version = "0.32", features = ["std"] }
tiny-keccak = { version = "2", features = ["keccak"] }
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
http = "1.4.0"
base64 = "0.22.1"
aes-gcm = "0.11.0-rc.2"
aead = "0.6.0-rc.5"
clap = { version = "4.5.54", features = ["derive"] }
hmac = "0.12.1"

[dev-dependencies]
tempfile = "3"



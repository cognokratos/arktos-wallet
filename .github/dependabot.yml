version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Semver-compatible updates land as one PR; breaking (major / 0.x minor)
      # bumps stay separate so they can be reviewed individually.
      cargo-compatible:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ["*"]

  # Bumps rust-toolchain.toml; keep the Dockerfile `rust:` image in sync.
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly

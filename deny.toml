# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run locally with `make deny` (or `cargo deny check`).

[graph]
all-features = true

[advisories]
# Vulnerabilities always fail. Unmaintained crates fail only when they are
# direct dependencies; unsound/yanked crates fail as well.
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # Keep in sync with .cargo/audit.toml.
    { id = "RUSTSEC-2026-0189", reason = "rmcp 0.12 DNS rebinding; fixed by the rmcp >= 1.4 migration planned for Stage 2. /mcp is still behind API-key auth." },
]

[licenses]
# Permissive licenses used by the current dependency tree.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
exceptions = [
    # MIT + no-false-attribs; required transitively by `bitcoin`.
    { allow = ["MITNFA"], crate = "hex_lit" },
]
# The crate itself has no license yet (publish = false); see README.
private = { ignore = true }

[bans]
# Duplicate versions are reported for visibility but do not fail the build;
# several are pulled in transitively (e.g. rand 0.8 vs 0.9 via rmcp).
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#07110D"/><stop offset="55%" stop-color="#0D1117"/><stop offset="100%" stop-color="#0A0E13"/></linearGradient>
  <linearGradient id="trusted" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10251A"/><stop offset="100%" stop-color="#0C1812"/></linearGradient>
  <linearGradient id="secret" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2B1115"/><stop offset="100%" stop-color="#1D0D10"/></linearGradient>
  <linearGradient id="sealed" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#302509"/><stop offset="100%" stop-color="#211A08"/></linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
  <marker id="gray" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8B949E"/></marker>
  <marker id="green" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FB950"/></marker>
  <marker id="gold" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#D29922"/></marker>
  <marker id="red" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F85149"/></marker>
  <style>text{font-family:Inter,Arial,sans-serif}.node{filter:url(#sh)}</style>
</defs>
<rect width="1920" height="1080" fill="url(#bg)"/>

<text x="75" y="68" font-size="42" font-weight="800" fill="#F0F6FC">Άρκτος Wallet</text>
<text x="75" y="108" font-size="20" fill="#8B949E">Cryptographic capability architecture for AI agents</text>
<rect x="1468" y="47" width="375" height="36" rx="18" fill="#10251A" stroke="#2EA043" stroke-width="1.5"/>
<text x="1655" y="71" font-size="15" font-weight="750" fill="#7EE787" text-anchor="middle">GIVE AGENTS CAPABILITIES, NEVER SECRETS</text>

<rect x="55" y="155" width="340" height="600" rx="28" fill="#10161D" stroke="#27313B" stroke-width="2"/>
<text x="85" y="195" font-size="16" font-weight="800" fill="#79C0FF">MODEL-VISIBLE</text>
<text x="85" y="222" font-size="15" fill="#8B949E">What the agent can request and receive</text>
<g class="node"><rect x="100" y="300" width="250" height="150" rx="24" fill="#111A24" stroke="#3D4B55" stroke-width="2"/>
<text x="225" y="340" font-size="27" font-weight="780" fill="#E6EDF3" text-anchor="middle">Agent / LLM</text>
<text x="225" y="380" font-size="16" font-weight="560" fill="#C9D1D9" text-anchor="middle">chooses tool + arguments</text>
<text x="225" y="407" font-size="15" fill="#8B949E" text-anchor="middle">identity is out-of-band</text>
<text x="225" y="431" font-size="15" fill="#8B949E" text-anchor="middle">never receives secrets</text></g>
<g class="node"><rect x="100" y="535" width="250" height="145" rx="24" fill="#0F2118" stroke="#2EA043" stroke-width="2"/>
<text x="225" y="575" font-size="25" font-weight="780" fill="#D8FFE1" text-anchor="middle">Public Results</text>
<text x="225" y="612" font-size="16" font-weight="560" fill="#B7F7C4" text-anchor="middle">address · public key · path</text>
<text x="225" y="639" font-size="15" fill="#8ECF9D" text-anchor="middle">wallet ids · timestamps</text>
<text x="225" y="664" font-size="15" font-weight="600" fill="#7EE787" text-anchor="middle">no seed · no private key</text></g>

<rect x="430" y="155" width="940" height="600" rx="28" fill="url(#trusted)" stroke="#2EA043" stroke-width="2.4"/>
<text x="460" y="195" font-size="16" font-weight="800" fill="#7EE787">TRUSTED SERVICE BOUNDARY · ARKTOS PROCESS</text>
<text x="460" y="222" font-size="15" fill="#8ECF9D">Rust · Axum · stateless MCP 2026-07-28 · owner-scoped operations</text>

<g class="node"><rect x="475" y="285" width="210" height="150" rx="22" fill="#111B18" stroke="#365F48" stroke-width="2"/>
<text x="580" y="323" font-size="24" font-weight="780" fill="#E6EDF3" text-anchor="middle">HTTP + Auth</text>
<text x="580" y="360" font-size="17" font-weight="650" fill="#B7F7C4" text-anchor="middle">X-API-KEY</text>
<text x="580" y="388" font-size="16" fill="#B6C2CF" text-anchor="middle">HMAC lookup</text>
<text x="580" y="414" font-size="14" fill="#8B949E" text-anchor="middle">caller attached out-of-band</text></g>

<g class="node"><rect x="735" y="285" width="215" height="150" rx="22" fill="#111B18" stroke="#365F48" stroke-width="2"/>
<text x="842" y="323" font-size="24" font-weight="780" fill="#E6EDF3" text-anchor="middle">MCP Router</text>
<text x="842" y="360" font-size="17" font-weight="650" fill="#B7F7C4" text-anchor="middle">4 typed tools</text>
<text x="842" y="388" font-size="15" fill="#B6C2CF" text-anchor="middle">schemas from Rust types</text>
<text x="842" y="414" font-size="14" font-weight="650" fill="#7EE787" text-anchor="middle">no signing / export tools</text></g>

<g class="node"><rect x="1000" y="285" width="315" height="150" rx="22" fill="#111B18" stroke="#365F48" stroke-width="2"/>
<text x="1157" y="323" font-size="24" font-weight="780" fill="#E6EDF3" text-anchor="middle">Wallet Services</text>
<text x="1157" y="359" font-size="16" font-weight="600" fill="#B7F7C4" text-anchor="middle">owner-scoped validation</text>
<text x="1157" y="387" font-size="15" fill="#B6C2CF" text-anchor="middle">create wallet · derive address</text>
<text x="1157" y="414" font-size="14" font-weight="650" fill="#7EE787" text-anchor="middle">public result only</text></g>

<g class="node"><rect x="620" y="510" width="500" height="180" rx="24" fill="#171A1E" stroke="#6E7681" stroke-width="2"/>
<text x="870" y="548" font-size="25" font-weight="790" fill="#E6EDF3" text-anchor="middle">Cryptographic Derivation</text>
<text x="870" y="585" font-size="16" font-weight="600" fill="#D0D7DE" text-anchor="middle">AES-256-GCM open / seal</text>
<text x="870" y="613" font-size="16" font-weight="600" fill="#D0D7DE" text-anchor="middle">BIP39 → BIP32 → BIP86 / BIP44</text>
<text x="870" y="641" font-size="15" font-weight="650" fill="#F0B7B3" text-anchor="middle">private material exists only transiently</text>
<text x="870" y="668" font-size="14" font-weight="650" fill="#F2CC60" text-anchor="middle">standards determine the answer</text></g>

<rect x="1410" y="155" width="455" height="600" rx="28" fill="#121317" stroke="#3A3032" stroke-width="2"/>
<text x="1440" y="195" font-size="16" font-weight="800" fill="#FF7B72">SECRET / OPERATOR AUTHORITY</text>
<text x="1440" y="222" font-size="15" fill="#A98F93">Never crosses into the model-visible surface</text>
<g class="node"><rect x="1460" y="285" width="355" height="115" rx="22" fill="url(#secret)" stroke="#F85149" stroke-width="2"/>
<text x="1637" y="322" font-size="23" font-weight="780" fill="#FFB4AE" text-anchor="middle">MASTER_KEY</text>
<text x="1637" y="354" font-size="15" font-weight="600" fill="#F0B7B3" text-anchor="middle">HKDF → WalletSeedKey</text>
<text x="1637" y="378" font-size="15" font-weight="600" fill="#F0B7B3" text-anchor="middle">HKDF → ApiKeyHmacKey</text></g>
<g class="node"><rect x="1460" y="445" width="355" height="115" rx="22" fill="url(#secret)" stroke="#F85149" stroke-width="2"/>
<text x="1637" y="482" font-size="23" font-weight="780" fill="#FFB4AE" text-anchor="middle">DATABASE_KEY</text>
<text x="1637" y="514" font-size="15" font-weight="600" fill="#F0B7B3" text-anchor="middle">SQLCipher page encryption</text>
<text x="1637" y="538" font-size="14" fill="#A98F93" text-anchor="middle">independent from MASTER_KEY</text></g>
<g class="node"><rect x="1460" y="605" width="355" height="110" rx="22" fill="url(#secret)" stroke="#F85149" stroke-width="2"/>
<text x="1637" y="642" font-size="22" font-weight="780" fill="#FFB4AE" text-anchor="middle">Transient Plaintext</text>
<text x="1637" y="674" font-size="14" font-weight="600" fill="#F0B7B3" text-anchor="middle">phrase · seed · extended private key</text>
<text x="1637" y="698" font-size="14" fill="#A98F93" text-anchor="middle">dropped / zeroized after derivation</text></g>

<line x1="350" y1="375" x2="475" y2="375" stroke="#8B949E" stroke-width="3" marker-end="url(#gray)"/>
<text x="412" y="354" font-size="13" font-weight="650" fill="#AAB6C3" text-anchor="middle">capability request</text>
<line x1="685" y1="360" x2="735" y2="360" stroke="#8B949E" stroke-width="3" marker-end="url(#gray)"/>
<line x1="950" y1="360" x2="1000" y2="360" stroke="#8B949E" stroke-width="3" marker-end="url(#gray)"/>
<path d="M1157 435L1157 475L870 475L870 510" fill="none" stroke="#8B949E" stroke-width="3" marker-end="url(#gray)"/>
<path d="M870 690L870 720L430 720L430 608L350 608" fill="none" stroke="#3FB950" stroke-width="3" marker-end="url(#green)"/>
<text x="585" y="705" font-size="14" font-weight="750" fill="#7EE787" text-anchor="middle">PUBLIC-ONLY response</text>
<path d="M1460 342L1360 342L1360 540L1120 540" fill="none" stroke="#F85149" stroke-width="2.7" stroke-dasharray="8 6" marker-end="url(#red)"/>
<text x="1260" y="524" font-size="13" font-weight="700" fill="#FF7B72" text-anchor="middle">purpose-specific key</text>
<path d="M1460 662L1350 662L1350 620L1120 620" fill="none" stroke="#F85149" stroke-width="2.7" stroke-dasharray="8 6" marker-end="url(#red)"/>
<text x="1248" y="646" font-size="13" font-weight="700" fill="#FF7B72" text-anchor="middle">secret exists briefly</text>

<rect x="55" y="800" width="1810" height="205" rx="28" fill="#0C1310" stroke="#243B2D" stroke-width="2"/>
<text x="85" y="840" font-size="16" font-weight="800" fill="#7EE787">PERSISTENT STATE · ENCRYPTED AT REST</text>
<text x="85" y="868" font-size="15" fill="#8ECF9D">Stateless MCP transport; persistent wallet authority lives in a single SQLCipher database</text>
<g class="node"><rect x="105" y="905" width="390" height="70" rx="20" fill="#0F1D16" stroke="#2EA043" stroke-width="1.8"/>
<text x="300" y="935" font-size="21" font-weight="760" fill="#D8FFE1" text-anchor="middle">api_keys</text>
<text x="300" y="960" font-size="14" fill="#B7F7C4" text-anchor="middle">HMAC-SHA256 hashes only</text></g>
<g class="node"><rect x="560" y="905" width="520" height="70" rx="20" fill="url(#sealed)" stroke="#D29922" stroke-width="1.8"/>
<text x="820" y="935" font-size="21" font-weight="760" fill="#F2CC60" text-anchor="middle">wallets.encrypted_passphrase</text>
<text x="820" y="960" font-size="14" fill="#E8D9A5" text-anchor="middle">AES-256-GCM envelope inside SQLCipher</text></g>
<g class="node"><rect x="1145" y="905" width="350" height="70" rx="20" fill="#0F1D16" stroke="#2EA043" stroke-width="1.8"/>
<text x="1320" y="935" font-size="21" font-weight="760" fill="#D8FFE1" text-anchor="middle">accounts</text>
<text x="1320" y="960" font-size="14" fill="#B7F7C4" text-anchor="middle">public keys · addresses · paths</text></g>
<g class="node"><rect x="1560" y="905" width="255" height="70" rx="20" fill="#101821" stroke="#3D4B55" stroke-width="1.8"/>
<text x="1687" y="935" font-size="18" font-weight="760" fill="#D0D7DE" text-anchor="middle">No private keys stored</text>
<text x="1687" y="960" font-size="14" fill="#8B949E" text-anchor="middle">no seeds returned</text></g>

<path d="M1157 435L1157 780L820 780L820 905" fill="none" stroke="#D29922" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#gold)"/>
<text x="1000" y="770" font-size="13" font-weight="700" fill="#F2CC60" text-anchor="middle">encrypted wallet secret</text>
<path d="M1157 435L1240 435L1240 780L1320 780L1320 905" fill="none" stroke="#3FB950" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#green)"/>
<text x="1320" y="770" font-size="13" font-weight="700" fill="#7EE787" text-anchor="middle">public account rows</text>
<path d="M580 435L580 780L300 780L300 905" fill="none" stroke="#3FB950" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#green)"/>
<text x="430" y="770" font-size="13" font-weight="700" fill="#7EE787" text-anchor="middle">caller identity</text>

<text x="55" y="1048" font-size="14" font-weight="600" fill="#5E6A75">CognoKratos · arktos-wallet</text>
<text x="1865" y="1048" font-size="14" font-weight="600" fill="#5E6A75" text-anchor="end">Agent authority is defined by the tool surface</text>
</svg>